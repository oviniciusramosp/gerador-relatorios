<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criador de Stories · Paradigma</title>
<link rel="stylesheet" href="paradigma.css">
<style>
  /* Shell (header/sidebar/zoom/segment) → paradigma.css body.app-editor + ui-shell.js */
  /* toggles UI / safe — canto sup. dir. do palco (mesmo lugar do índice no diagramador) */
  .stage-toggles-host {
    position: absolute; top: .55rem; right: .55rem; z-index: 35;
    display: flex; flex-direction: column; gap: .35rem;
    pointer-events: none;
  }
  .stage-toggles-host button {
    pointer-events: auto;
    width: 2.25rem; height: 2.25rem; padding: 0;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 1px solid var(--hair-strong);
    background: color-mix(in srgb, var(--ground) 62%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--muted); opacity: .82;
    box-shadow: 0 8px 24px -12px #000;
    cursor: pointer; transition: opacity .15s, color .15s, background .15s, border-color .15s;
  }
  .stage-toggles-host button svg { width: 18px; height: 18px; display: block; }
  .stage-toggles-host button:hover {
    opacity: 1; color: var(--ink);
    border-color: color-mix(in srgb, var(--violet) 40%, var(--hair-strong));
  }
  .stage-toggles-host button[aria-pressed="true"] {
    opacity: 1; color: #fff;
    border-color: var(--violet);
    background: color-mix(in srgb, var(--violet) 78%, var(--ground));
  }

  /* ---------- palco (slider: setas | story centralizado | setas) ---------- */
  section.stage {
    position: relative;
    flex: 1 1 auto;
    display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 130%, color-mix(in srgb, var(--violet) 26%, transparent), transparent 72%),
      var(--ground);
  }
  .stage-main {
    min-height: 0; min-width: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: .35rem;
    padding: .6rem .5rem;
  }
  .side-nav {
    width: 2.75rem; height: 2.75rem; padding: 0;
    display: grid; place-items: center;
    border-radius: 999px;
    color: var(--lilac);
    background: color-mix(in srgb, var(--lilac) 10%, transparent);
    border: 1px solid var(--hair-strong);
    flex: none;
    z-index: 2;
  }
  .side-nav svg { width: 22px; height: 22px; display: block; }
  .side-nav:hover:not(:disabled) {
    color: var(--ink);
    border-color: var(--violet);
    background: color-mix(in srgb, var(--violet) 18%, transparent);
  }
  .side-nav:disabled { opacity: .28; cursor: default; }

  #stage {
    min-height: 0; min-width: 0; overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    /* reserva espaço visual do “slide” em foco */
    height: 100%;
  }
  .page-counter {
    flex: none;
    font-size: .72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    user-select: none;
  }

  /* wrapper = tamanho visual (PAGE × zoom); #pages escala a partir do topo-esq */
  #pages-wrap {
    position: relative;
    overflow: hidden;
    /* width/height setados em JS conforme o zoom */
    flex: none;
  }
  #pages {
    transform-origin: top left;
    width: 360px; height: 640px;
  }

  /* página story 360×640 (trabalho) → export 1080×1920 — BG branco + sombra forte (legível no ground roxo) */
  .story-page {
    position: relative;
    width: 360px; height: 640px;
    background: #FFFFFF; color: #000;
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--lilac) 22%, transparent),
      0 4px 12px rgba(0, 0, 0, .28),
      0 24px 56px -12px rgba(0, 0, 0, .55),
      0 48px 100px -28px rgba(0, 0, 0, .5);
    font-family: "Plex", "IBM Plex Sans", system-ui, sans-serif;
    font-synthesis: style;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    flex: none;
  }
  /* full-bleed + scale/pan (igual .cover-bg do Diagramador: overflow da página recorta) */
  .story-page .bg-layer {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }

  /* Imagem de Fundo — mesmos shells do Diagramador (capa/contracapa) */
  .filebtn { position: relative; overflow: hidden; }
  .filebtn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .bgactions { display: flex; gap: .4rem; }
  .bgactions .fieldbtn { flex: 1; justify-content: center; min-width: 0; }
  .bgactions[hidden], #bgXformPos[hidden], #bgXformScale[hidden] { display: none !important; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  aside .field-row { display: flex; justify-content: space-between; align-items: baseline; }
  aside .field-val {
    color: var(--ink); font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: center; gap: .3rem;
  }
  aside .resetbtn {
    border: 0; background: transparent; padding: 0 .1rem; margin: 0;
    color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1;
  }
  aside .resetbtn:hover { color: var(--ink); }
  /* freestyle: blocks-layer = safe area; left/top em px, width = scale % */
  .story-page .blocks-layer {
    position: absolute;
    pointer-events: none;
    z-index: 3;
  }
  .story-page.editing .blocks-layer > .blk { pointer-events: auto; }
  /* guia de snap horizontal (Y): peers = roxo; centro = coral */
  .story-page .snap-guide {
    position: absolute;
    left: -4px; right: -4px;
    height: 0;
    border-top: 1.5px solid color-mix(in srgb, #4E39FF 85%, #fff);
    box-shadow: 0 0 0 1px color-mix(in srgb, #4E39FF 25%, transparent);
    pointer-events: none;
    z-index: 40;
  }
  .story-page .snap-guide.is-center {
    border-top-color: #FF4D6A;
    box-shadow: 0 0 0 1px color-mix(in srgb, #FF4D6A 35%, transparent);
  }
  .story-page .snap-guide .snap-guide-x {
    display: none;
    position: absolute;
    left: 50%;
    top: 0;
    transform: translate(-50%, -50%);
    width: 14px; height: 14px;
    color: #FF4D6A;
    filter: drop-shadow(0 0 1px rgba(255, 255, 255, .9));
    line-height: 0;
  }
  .story-page .snap-guide.is-center .snap-guide-x { display: grid; place-items: center; }
  .story-page .snap-guide .snap-guide-x svg { display: block; width: 12px; height: 12px; }
  .story-page .snap-guide[hidden] { display: none !important; }
  /* guia de snap vertical (X) */
  .story-page .snap-guide-v {
    position: absolute;
    top: -4px; bottom: -4px;
    width: 0;
    border-left: 1.5px solid color-mix(in srgb, #4E39FF 85%, #fff);
    box-shadow: 0 0 0 1px color-mix(in srgb, #4E39FF 25%, transparent);
    pointer-events: none;
    z-index: 40;
  }
  .story-page .snap-guide-v.is-center {
    border-left-color: #FF4D6A;
    box-shadow: 0 0 0 1px color-mix(in srgb, #FF4D6A 35%, transparent);
  }
  .story-page .snap-guide-v[hidden] { display: none !important; }

  /* lista de camadas (sidebar Conteúdo) */
  .layers-list {
    display: grid; gap: .2rem;
    max-height: min(40vh, 280px);
    overflow-y: auto;
    padding: .1rem 0;
  }
  .layer-row {
    display: flex; align-items: center; gap: .4rem;
    padding: .32rem .4rem; border-radius: 7px;
    border: 1px solid var(--hair);
    background: transparent; color: var(--muted);
    cursor: pointer; user-select: none;
    font-size: .78rem; font-stretch: 90%;
  }
  .layer-row:hover { border-color: var(--hair-strong); color: var(--ink); }
  .layer-row[aria-current="true"] {
    border-color: var(--violet); color: var(--ink);
    background: color-mix(in srgb, var(--violet) 16%, transparent);
  }
  .layer-row.dragging { opacity: .45; }
  .layer-row.drop-before { box-shadow: inset 0 2px 0 0 var(--violet); }
  .layer-row.drop-after { box-shadow: inset 0 -2px 0 0 var(--violet); }
  .layer-grip {
    flex: none; width: 18px; height: 18px; display: grid; place-items: center;
    color: var(--lilac); cursor: grab; border-radius: 4px;
  }
  .layer-grip:hover { color: var(--ink); background: color-mix(in srgb, var(--lilac) 12%, transparent); }
  .layer-grip:active { cursor: grabbing; }
  .layer-grip svg { width: 12px; height: 12px; display: block; }
  .layer-ico {
    flex: none; width: 20px; height: 20px; display: grid; place-items: center;
    border: 1px solid var(--hair); border-radius: 5px; color: var(--lilac);
  }
  .layer-row[aria-current="true"] .layer-ico { border-color: var(--violet); color: var(--ink); }
  .layer-ico svg { width: 13px; height: 13px; display: block; }
  .layer-label {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: inherit;
  }
  .layer-moves { flex: none; display: flex; flex-direction: column; gap: 0; }
  .layer-nudge {
    width: 1.35rem; height: .85rem; padding: 0; margin: 0;
    border: 0; border-radius: 3px; background: transparent;
    color: var(--muted); cursor: pointer; font-size: .55rem; line-height: 1;
    display: grid; place-items: center;
  }
  .layer-nudge:hover:not(:disabled) { color: var(--ink); background: color-mix(in srgb, var(--lilac) 14%, transparent); }
  .layer-nudge:disabled { opacity: .28; cursor: default; }

  /* alças #bhandle/#badd/#bmenu + #fmtbar → paradigma.css (ui-handles / ui-fmtbar)
     Novo bloco: clique no vazio da página → #colAddMenu (sem hover de + nas colunas) */

  /* alça de rotação — canto superior direito do bloco focado (fixed, fora do artboard scale) */
  #brotate {
    position: fixed; z-index: 26;
    width: 18px; height: 18px;
    min-width: 18px; min-height: 18px;
    display: grid; place-items: center;
    padding: 0; margin: 0;
    border: 1.5px solid color-mix(in srgb, #4E39FF 55%, #fff);
    border-radius: 50%;
    background: #fff;
    color: #4E39FF;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
    cursor: grab;
    /* ancora no ponto do canto TR (já com pad); centro do botão no ponto */
    transform: translate(-50%, -50%);
    line-height: 0;
    appearance: none; -webkit-appearance: none;
    user-select: none;
    touch-action: none;
  }
  #brotate:hover {
    background: color-mix(in srgb, #4E39FF 10%, #fff);
    border-color: #4E39FF;
  }
  #brotate:active,
  body.rotating-block #brotate {
    cursor: grabbing;
    background: #4E39FF;
    color: #fff;
    border-color: #4E39FF;
  }
  #brotate svg { display: block; width: 12px; height: 12px; pointer-events: none; }
  #brotate[hidden] { display: none !important; }
  #brotate-badge {
    position: fixed; z-index: 27;
    min-width: 2.2rem;
    padding: .18rem .4rem;
    border-radius: 6px;
    font-size: .68rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    color: #fff;
    background: #4E39FF;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    pointer-events: none;
    transform: translate(-50%, -50%);
    user-select: none;
  }
  #brotate-badge.is-snap {
    background: #29E899;
    color: #0E0C1B;
  }
  #brotate-badge[hidden] { display: none !important; }
  body.rotating-block { cursor: grabbing !important; }
  body.rotating-block .story-page.editing .blocks-layer > .blk { cursor: grabbing !important; }

  /* cursor de “área vazia” no artboard em edição */
  .story-page.editing .blocks-layer,
  .story-page.editing .bg-layer { cursor: cell; }
  .story-page.editing .blocks-layer > .blk { cursor: default; }
  .story-page.editing .blocks-layer > .blk.text { cursor: text; }
  .story-page.editing .blocks-layer > .blk.image,
  .story-page.editing .blocks-layer > .blk.sticker { cursor: grab; }

  /* logo Paradigma — header dentro da safe; footer centrado na faixa inferior (55 = 165 export) */
  .story-page .story-logo {
    position: absolute;
    display: flex;
    align-items: center;
    z-index: 5;
    pointer-events: none;
    box-sizing: border-box;
  }
  .story-page .story-logo.lg-header {
    /* top/left/right setados em JS via safe margins */
  }
  .story-page .story-logo.lg-footer {
    /* height = safe.bottom; bottom: 0 — centrado verticalmente na faixa */
  }
  .story-page .story-logo .story-logo-hit {
    display: inline-flex;
    line-height: 0;
  }
  .story-page .story-logo svg { display: block; }

  /* picker do logo (sidebar) — 2×2, preview dos desenhos */
  .logopick {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .3rem;
    margin-top: .15rem;
    width: 100%;
  }
  .logopick button {
    height: 64px; min-width: 0; width: 100%; box-sizing: border-box;
    display: grid; place-items: center;
    border: 1px solid var(--hair); border-radius: var(--r);
    background: transparent; color: var(--muted); cursor: pointer;
    padding: .35rem;
  }
  .logopick button:hover { border-color: var(--hair-strong); color: var(--ink); }
  .logopick button[aria-pressed="true"] {
    border-color: var(--violet); color: var(--ink);
    background: color-mix(in srgb, var(--violet) 16%, transparent);
  }
  .logopick button svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  [data-logoopts][hidden] { display: none !important; }

  /* cards da paleta (aba Conteúdo) — iguais ao diagramador: .blockrow + ⋮ */
  .blocktypes { display: grid; gap: .25rem; }
  .blocktypes > button,
  .blockrow {
    display: flex; align-items: center; gap: .55rem; text-align: left;
    padding: .38rem .45rem; border: 1px solid var(--hair); border-radius: var(--r);
    background: transparent; color: var(--muted); cursor: pointer; font-stretch: 85%; font-size: .78rem;
  }
  .blocktypes > button .ico,
  .blockrow button[data-type] .ico {
    flex: none; width: 22px; height: 22px; display: grid; place-items: center;
    border: 1px solid var(--hair); border-radius: 5px; color: var(--lilac);
    font-size: 12px; line-height: 1;
  }
  .blocktypes > button .ico svg,
  .blockrow button[data-type] .ico svg { width: 15px; height: 15px; display: block; }
  .blocktypes > button:hover,
  .blockrow:hover { border-color: var(--hair-strong); color: var(--ink); }
  .blocktypes > button:hover .ico,
  .blockrow:hover .ico { color: var(--ink); }
  .blockrow { gap: .15rem; cursor: default; }
  .blockrow button[data-type] {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: .55rem;
    padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer;
    font: inherit; text-align: left;
  }
  .blockmenu {
    flex: none; width: 22px; height: 22px; display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 5px;
    background: transparent; color: var(--muted); cursor: pointer; font-size: .85rem; line-height: 1;
  }
  .blockmenu svg { width: 14px; height: 14px; display: block; }
  .blockmenu:hover { color: var(--ink); background: color-mix(in srgb, var(--lilac) 14%, transparent); }

  /* popover ⋮ estilo do tipo Texto */
  #blockStylePanel.float-panel { width: min(232px, calc(100vw - 16px)); }

  /* modal do gráfico (iframe embed — igual diagramacao) */
  #chartModal { position: fixed; inset: 0; z-index: 60; }
  #chartModal[hidden] { display: none; }
  #chartModal .cm-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  #chartModal .cm-panel {
    position: absolute; inset: 3vh 3vw; display: flex; flex-direction: column;
    border: 1px solid var(--hair-strong); border-radius: 12px; overflow: hidden;
    background: var(--ground); box-shadow: 0 24px 80px -20px #000;
  }
  #chartModal .cm-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: .55rem .75rem; border-bottom: 1px solid var(--hair);
    color: var(--ink); font-size: .9rem; font-weight: 600;
  }
  #chartModal .cm-bar button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 1rem; padding: .2rem .5rem; border-radius: 6px;
  }
  #chartModal .cm-bar button:hover {
    background: color-mix(in srgb, var(--lilac) 14%, transparent); color: var(--ink);
  }
  #chartModal iframe { flex: 1; width: 100%; border: 0; background: var(--ground); }

  /* #imgPanel / #textPanel: shell .float-panel + .fieldbtn em paradigma.css */
  /* reancoragem pós-escala: fade out/in (mesmo contrato do sticker) */
  #imgPanel.float-panel,
  #stickerPanel.sticker-panel {
    transition: opacity .14s ease;
  }
  #imgPanel.float-panel.is-fading,
  #stickerPanel.sticker-panel.is-fading {
    opacity: 0;
    pointer-events: none;
  }
  #imgPanel .swrow {
    display: flex; align-items: center; justify-content: space-between; gap: .6rem;
    font-size: .78rem; color: var(--muted);
  }
  #imgPanel .sw {
    flex: none; width: 2.1rem; height: 1.2rem; padding: 0; border-radius: 999px;
    border: 1px solid var(--hair-strong);
    background: color-mix(in srgb, var(--lilac) 10%, transparent);
    position: relative; cursor: pointer;
  }
  #imgPanel .sw::after {
    content: ""; position: absolute; top: 50%; left: 2px; transform: translateY(-50%);
    width: .85rem; height: .85rem; border-radius: 50%; background: var(--muted);
    transition: left .12s, background .12s;
  }
  #imgPanel .sw[aria-checked="true"] { background: var(--mint); border-color: var(--mint); }
  #imgPanel .sw[aria-checked="true"]::after { left: calc(100% - .85rem - 2px); background: #fff; }
  body.grabbing, body.grabbing * { cursor: grabbing !important; }

  /* menu Texto | Imagem ao clicar no + */
  #colAddMenu {
    position: fixed; z-index: 55; display: grid; gap: .15rem; min-width: 140px;
    padding: .3rem; border: 1px solid var(--hair-strong); border-radius: 10px;
    background: color-mix(in srgb, var(--lilac) 10%, var(--ground));
    box-shadow: 0 16px 50px -16px #000;
  }
  #colAddMenu[hidden] { display: none; }
  #colAddMenu button {
    display: flex; align-items: center; gap: .5rem; width: 100%;
    padding: .45rem .55rem; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink); cursor: pointer;
    font-size: .82rem; text-align: left;
  }
  #colAddMenu button:hover {
    background: color-mix(in srgb, var(--violet) 16%, transparent);
  }
  #colAddMenu button svg { width: 16px; height: 16px; flex: none; color: var(--lilac); }

  .story-page .blk {
    position: absolute; left: 0;
    box-sizing: border-box; padding: 0;
    outline: none; min-height: 1.2em;
  }
  .story-page .blk.text {
    right: 0;
    cursor: text; word-break: break-word; white-space: pre-wrap;
    /* respiro mínimo — o anel de foco (::after) fica colado no conteúdo, como no diagramador */
    padding: 1px 0;
  }
  /* highlights custom (fmtbar). Marcador/pincel/pill: CSS completo via hiliteBrushCss() */
  .story-page .blk.text .txt-hl {
    --hl: #FFF3A3;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .story-page .blk.text .txt-hl-solid {
    background-color: var(--hl);
  }
  .story-page .blk.text .txt-hl-underline {
    background: none;
    border-bottom: 0.28em solid var(--hl);
    padding-bottom: 0.04em;
  }
  .story-page .blk.image {
    padding: 0; overflow: visible;
    display: flex; flex-direction: column;
  }
  .story-page .blk.image .img-frame {
    width: 100%; height: 100%;
    /* clipa o SVG/img; box-shadow do frame não é cortado pelo overflow:hidden */
    overflow: hidden;
  }
  .story-page .blk.image .img-slot {
    width: 100%; height: 100%;
    display: grid; place-items: center;
    background: color-mix(in srgb, #4E39FF 8%, #f2f2f2);
    color: #6b6b6b;
    font-size: 28px; font-stretch: 85%; letter-spacing: .04em;
    border: 2px dashed color-mix(in srgb, #4E39FF 30%, #bbb);
    box-sizing: border-box;
  }
  .story-page .blk.image img {
    width: 100%; height: 100%; display: block;
    /* sem border-radius: o .img-frame clipa */
  }
  /* sticker (token etc.): ícone quadrado, SVG inline */
  .story-page .blk.sticker {
    padding: 0; overflow: visible;
  }
  .story-page .blk.sticker .sticker-frame {
    width: 100%; height: 100%;
  }
  .story-page .blk.sticker .sticker-icon {
    width: 100%; height: 100%;
    display: grid; place-items: center;
  }
  .story-page .blk.sticker .sticker-icon svg {
    width: 100%; height: 100%; display: block;
  }
  .story-page .blk.sticker .sticker-icon.sticker-loading {
    border-radius: 50%;
    background: color-mix(in srgb, #4E39FF 10%, #f0f0f0);
  }
  .story-page .blk.sticker .sticker-icon.sticker-missing {
    border-radius: 50%;
    background: #eee;
    color: #666;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  /* painel sticker: grid de tokens */
  #stickerPanel.sticker-panel {
    width: min(272px, calc(100vw - 16px));
  }
  #stickerPanel .sticker-search-field input[type="search"] {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border, #ddd);
    border-radius: 8px;
    padding: .4rem .55rem;
    font: inherit;
    font-size: 13px;
    background: var(--surface, #fff);
    color: inherit;
  }
  #stickerPanel .sticker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .35rem;
    max-height: 240px;
    overflow: auto;
    margin: .15rem 0 .35rem;
    padding: .15rem;
  }
  #stickerPanel .sticker-pick {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .2rem;
    padding: .35rem .2rem;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    color: inherit;
    font: inherit;
  }
  #stickerPanel .sticker-pick:hover {
    background: color-mix(in srgb, var(--violet, #4E39FF) 10%, transparent);
  }
  #stickerPanel .sticker-pick.on {
    border-color: color-mix(in srgb, var(--violet, #4E39FF) 45%, transparent);
    background: color-mix(in srgb, var(--violet, #4E39FF) 12%, transparent);
  }
  #stickerPanel .sticker-pick-ico {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
  }
  #stickerPanel .sticker-pick-ico svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #stickerPanel .sticker-pick-ico.sticker-loading {
    border-radius: 50%;
    background: color-mix(in srgb, #4E39FF 12%, #eee);
  }
  #stickerPanel .sticker-pick-lab {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--muted, #777);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #stickerPanel .sticker-empty {
    grid-column: 1 / -1;
    margin: .4rem 0;
    font-size: 12px;
    color: var(--muted, #777);
    text-align: center;
  }
  /* anel de foco → .focus-ring em paradigma.css (mesmos tokens) */
  .story-page.editing .blk.active-block,
  .story-page.editing .blk.image.selected,
  .story-page.editing .blk.image.imgsel,
  .story-page.editing .blk.sticker.selected,
  .story-page.editing .blk.sticker.imgsel {
    outline: none;
  }
  .story-page.editing .blk.active-block::after,
  .story-page.editing .blk.image.selected::after,
  .story-page.editing .blk.image.imgsel::after,
  .story-page.editing .blk.sticker.selected::after,
  .story-page.editing .blk.sticker.imgsel::after {
    content: '';
    position: absolute;
    inset: -5px -7px;
    border: 2px solid color-mix(in srgb, #4E39FF 50%, transparent);
    border-radius: 8px;
    pointer-events: none;
    z-index: 1;
  }
  /* zonas de margem — anel via box-shadow (top/bottom = 55, left/right = 37 no editor) */
  .story-page .safe-layer {
    position: absolute; inset: 0; pointer-events: none; z-index: 20;
    overflow: hidden;
  }
  .story-page .safe-hole {
    position: absolute;
    box-sizing: border-box;
    /* borda do retângulo seguro */
    outline: 1px solid color-mix(in srgb, #FF4D6A 55%, transparent);
    outline-offset: -1px;
    /* preenche TUDO fora do hole até cobrir o canvas (margens reais) */
    box-shadow: 0 0 0 9999px color-mix(in srgb, #FF4D6A 22%, transparent);
  }

  /*
   * chrome Instagram — px no canvas de TRABALHO 360×640
   * (≈ 1/3 do export; safe top/bottom = 55px, laterais = 37px).
   */
  .story-page .ui-layer {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  .ui-layer .ig-top {
    position: absolute; left: 0; right: 0; top: 0;
    height: 55px; /* = SAFE.top */
    box-sizing: border-box;
    padding: 10px 10px 0;
  }
  .ui-layer .ig-progress {
    display: flex; gap: 3px; margin-bottom: 8px;
  }
  .ui-layer .ig-progress i {
    flex: 1; height: 2px; border-radius: 1px;
    background: rgba(255,255,255,.35);
    box-shadow: 0 1px 1px rgba(0,0,0,.2);
  }
  .ui-layer .ig-progress i.on { background: #fff; }
  .ui-layer .ig-progress i.done { background: rgba(255,255,255,.88); }
  .ui-layer .ig-user {
    display: flex; align-items: center; gap: 7px; color: #fff;
  }
  .ui-layer .ig-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
    padding: 1px; box-sizing: border-box;
    flex: none;
  }
  .ui-layer .ig-avatar span {
    display: block; width: 100%; height: 100%; border-radius: 50%;
    background: #222; border: 1px solid #000;
  }
  .ui-layer .ig-name {
    font-size: 11px; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.55);
  }
  .ui-layer .ig-time {
    font-size: 10px; opacity: .8; margin-left: 2px; font-weight: 400;
    text-shadow: 0 1px 2px rgba(0,0,0,.55);
  }
  .ui-layer .ig-close {
    margin-left: auto; width: 16px; height: 16px; color: #fff;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
  }
  .ui-layer .ig-bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 55px; /* = SAFE.bottom */
    box-sizing: border-box;
    padding: 8px 10px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .ui-layer .ig-reply {
    flex: 1; height: 30px; border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,.65);
    color: rgba(255,255,255,.85); font-size: 11px;
    display: flex; align-items: center; padding: 0 12px;
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
    box-sizing: border-box;
  }
  .ui-layer .ig-ico {
    width: 22px; height: 22px; color: #fff; flex: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
  }

  /* Reels chrome */
  .ui-layer.reels .ig-top {
    padding: 14px 12px 0;
  }
  .ui-layer.reels .ig-reels-bar {
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; padding: 0 4px;
  }
  .ui-layer.reels .ig-reels-title {
    font-weight: 700; font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }
  .ui-layer.reels .ig-reels-search {
    font-size: 16px; line-height: 1; opacity: .95;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }
  .ui-layer.reels .ig-rail {
    position: absolute; right: 8px; bottom: 140px;
    display: grid; gap: 12px; justify-items: center; color: #fff;
  }
  .ui-layer.reels .ig-rail .rail-btn {
    display: grid; gap: 3px; justify-items: center;
    font-size: 9px; font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,.55);
  }
  .ui-layer.reels .ig-rail svg {
    width: 22px; height: 22px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
  }
  .ui-layer.reels .ig-rail .rail-av {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid #fff; background: #333; position: relative;
  }
  .ui-layer.reels .ig-rail .rail-av::after {
    content: "+"; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: #FF2D55; color: #fff;
    font-size: 10px; font-weight: 700; display: grid; place-items: center; line-height: 1;
    border: 1px solid #000;
  }
  .ui-layer.reels .ig-cap {
    position: absolute; left: 10px; right: 42px; bottom: 18px; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.55);
  }
  .ui-layer.reels .ig-cap .cap-user { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .ui-layer.reels .ig-cap .cap-txt { font-size: 11px; line-height: 1.3; opacity: .95; }
  .ui-layer.reels .ig-cap .cap-audio {
    margin-top: 6px; font-size: 10px; display: flex; align-items: center; gap: 8px; opacity: .9;
  }
  .ui-layer.reels .ig-cap .cap-audio svg { width: 12px; height: 12px; }

  /* ---------- faixa horizontal de páginas (jump direto) ---------- */
  .page-strip {
    border-top: 1px solid var(--hair);
    background: color-mix(in srgb, var(--ground) 92%, #000);
    padding: .55rem .75rem .7rem;
    min-height: 0;
  }
  .page-strip .strip-scroll {
    overflow-x: auto; overflow-y: hidden;
    display: flex; gap: .5rem; align-items: center;
    scroll-behavior: smooth; min-width: 0;
    padding: .15rem 0;
  }
  .page-strip .strip-scroll::-webkit-scrollbar { height: 6px; }
  .page-strip .strip-scroll::-webkit-scrollbar-thumb { background: var(--hair-strong); border-radius: 3px; }
  .page-strip .thumb {
    flex: none; width: 40px; height: 71px; border-radius: 6px; overflow: hidden;
    border: 2px solid transparent; cursor: pointer; padding: 0;
    background: #1a1730; position: relative;
  }
  .page-strip .thumb:hover { border-color: var(--hair-strong); }
  .page-strip .thumb[aria-current="true"] { border-color: var(--violet); }
  .page-strip .thumb .thumb-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .page-strip .thumb .thumb-n {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    font-size: .58rem; font-variant-numeric: tabular-nums;
    color: #fff; text-shadow: 0 1px 2px #000; font-weight: 600;
  }
  .page-strip .thumb .thumb-del {
    position: absolute; top: 2px; right: 2px; z-index: 2;
    width: 16px; height: 16px; padding: 0; margin: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 4px;
    background: rgba(0, 0, 0, .62);
    color: #fff; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity .12s, background .12s;
  }
  .page-strip .thumb .thumb-del svg { width: 10px; height: 10px; display: block; }
  .page-strip .thumb:hover .thumb-del,
  .page-strip .thumb:focus-within .thumb-del {
    opacity: 1; pointer-events: auto;
  }
  .page-strip .thumb .thumb-del:hover {
    background: #FF6B6B; color: #fff;
  }
  .page-strip .thumb-add {
    flex: none; width: 40px; height: 71px; border-radius: 6px;
    border: 1.5px dashed var(--hair-strong); background: transparent;
    color: var(--muted); cursor: pointer;
    display: grid; place-items: center; font-size: 1.4rem; line-height: 1;
  }
  .page-strip .thumb-add:hover { border-color: var(--violet); color: var(--ink); }

  #toast {
    position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
    z-index: 80; padding: .55rem .9rem; border-radius: 8px;
    background: color-mix(in srgb, var(--lilac) 16%, var(--ground));
    border: 1px solid var(--hair-strong); color: var(--ink);
    font-size: .82rem; box-shadow: 0 12px 40px -16px #000;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: color-mix(in srgb, #FF6B6B 50%, var(--hair)); }

  /* #fmtbar → paradigma.css (ui-fmtbar.js; Stories: withLink:false, sem #linkedit) */
  .fieldtitle { color: var(--ink); font-size: .82rem; }

  /* seleção de texto no miolo (não herdar user-select:none do app) */
  .story-page .blk.text,
  .story-page .blk.text * {
    -webkit-user-select: text;
    user-select: text;
  }
  .story-page .blk.text b, .story-page .blk.text strong { font-weight: 700; }
  .story-page .blk.text i, .story-page .blk.text em { font-style: italic; }
  .story-page .blk.text u { text-decoration: underline; }
  .story-page .blk.text s, .story-page .blk.text strike { text-decoration: line-through; }
</style>
</head>
<body class="app-editor">
<header>
  <div class="hleft">
    <!-- ícones via uiIco (Ionicons) no stories.js — mesmo padrão do diagramador -->
    <button type="button" id="btnSidebar" title="Mostrar ou esconder o menu" aria-label="Mostrar ou esconder o menu lateral" aria-controls="sidebar" aria-pressed="true"></button>
    <h1>Criador de Stories</h1>
  </div>
  <div class="zoomwrap">
    <button type="button" id="zoomFit" title="Ajustar à altura" aria-label="Ajustar zoom à altura" aria-pressed="true"></button>

<div id="downloadMenu" class="float-menu" hidden>
  <button type="button" data-dl="png" title="Baixar a página atual em PNG"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="12" height="12" rx="1.5"/><circle cx="6" cy="6" r="1.2"/><path d="M2 11l3.5-3.5L9 11l2-2 3 3"/></svg><span class="dl-label">PNG</span><span class="dl-badge">Página</span></button>

  <button type="button" data-dl="jpg-all" data-dl-multi hidden title="Baixar todas as páginas em JPG (um .zip)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="12" height="12" rx="1.5"/><circle cx="6" cy="6" r="1.2"/><path d="M2 11l3.5-3.5L9 11l2-2 3 3"/><path d="M11 1.5h1.5A1.5 1.5 0 0 1 14 3v10" stroke-linecap="round"/></svg><span class="dl-label">JPG</span><span class="dl-badge">Todos</span></button>

<main id="main">
  <aside id="sidebar">
    <div class="sidebar-panel">
    <div class="segment" id="segment" role="tablist">
      <button type="button" data-seg="documento" aria-selected="true">Configurações</button>
      <button type="button" data-seg="conteudo" aria-selected="false">Conteúdo</button>
    </div>

    <div class="pane-stack">
      <div class="pane" data-pane="documento">
        <!-- Em Branco / Abrir na sidebar (como diagramador) — topbar só undo/redo/Baixar -->
        <details open>
          <summary>Documento</summary>
          <div class="body">
            <div class="row3">
              <button type="button" id="btnNew">Em Branco</button>
              <button type="button" id="btnOpen" title="Abrir um projeto (.pdgm.zip ou .pdgm.json)">Abrir .zip</button>
            </div>
            <input type="file" id="openFile" accept=".zip,.json,application/zip,application/x-zip-compressed,application/json" hidden>
          </div>
        </details>

        <details open>
          <summary>Formato</summary>
          <div class="body">
            <label class="field">Modo
              <select id="marginMode">
                <option value="stories">Stories</option>
                <option value="reels">Reels</option>
              </select>
            </label>
          </div>
        </details>

        <details open>
          <summary>Logo Paradigma</summary>
          <div class="body">
            <div class="logopick" data-logopick>
              <button type="button" data-logokind="none" title="Nenhum" aria-pressed="true"></button>
              <button type="button" data-logokind="icone" title="Ícone"></button>
              <button type="button" data-logokind="full" title="Completo"></button>
              <button type="button" data-logokind="nome" title="Nome"></button>
            </div>
            <div class="grid2" data-logoopts hidden>
              <div class="field">Posição
                <div data-slot="logopos"></div>
              </div>
              <div class="field">Alinhamento
                <div data-slot="logoalign"></div>
              </div>
            </div>
            <div class="grid2" data-logoopts hidden>
              <label class="field">Cor do logo
                <button type="button" class="colorfield" data-logocolor title="Escolher cor do logo" aria-label="Cor do logo"></button>
              </label>
              <label class="field"><span class="field-row">Tamanho <span class="field-val"><span data-logosizev>0.7×</span><button type="button" class="resetbtn" data-logosizereset title="Redefinir para 0.7×">↺</button></span></span>
                <input type="range" data-logosize min="40" max="260" value="70" data-snaps="40,70,100,150,200,260" data-edit-scale="0.01">
              </label>
            </div>
          </div>
        </details>

        <details open>
          <summary>Página</summary>
          <div class="body">
            <label class="field">Fundo
              <button type="button" class="colorfield" id="pageBg" title="Cor de fundo do story" aria-label="Cor de fundo do story" style="background:#FFFFFF"></button>
            </label>
            <div class="field"><span class="fieldtitle">Imagem de Fundo</span>
              <button type="button" class="filebtn" id="btnBgImage">Selecionar<input type="file" id="bgFile" accept="image/*"></button>
              <div class="bgactions" id="bgActions" hidden>
                <label class="fieldbtn filebtn" id="btnBgReplace"><span>Substituir</span><input type="file" id="bgFileReplace" accept="image/*"></label>
                <button type="button" class="fieldbtn danger" id="btnBgClear"><span>Remover</span></button>
              </div>
            </div>
            <div class="grid2" id="bgXformPos" hidden>
              <label class="field"><span class="field-row">Posição Horizontal ↔ <span class="field-val"><button type="button" class="resetbtn" id="bgXReset" title="Redefinir para o centro">↺</button></span></span>
                <input type="range" id="bgX" min="0" max="100" value="50" data-snaps="0,25,50,75,100">
              </label>
              <label class="field"><span class="field-row">Posição Vertical ↕ <span class="field-val"><button type="button" class="resetbtn" id="bgYReset" title="Redefinir para o centro">↺</button></span></span>
                <input type="range" id="bgY" min="0" max="100" value="50" data-snaps="0,25,50,75,100">

            </div>
            <label class="field" id="bgXformScale" hidden><span class="field-row">Escala da imagem <span class="field-val"><span id="bgScaleVal"></span><button type="button" class="resetbtn" id="bgScaleReset" title="Redefinir para 1×">↺</button></span></span>
              <input type="range" id="bgScale" min="100" max="250" value="100" data-snaps="100,125,150,200,250" data-edit-scale="0.01">
            </label>
          </div>
        </details>
      </div>

      <div class="pane" data-pane="conteudo" hidden>
        <!-- lista vertical ícone+label — card Texto com ⋮ de estilo global (letter-spacing) -->
        <div class="sb-static">
          <div class="sb-static-title">Bloco</div>
          <div class="body">
            <div class="blocktypes" id="blocktypes">
              <div class="blockrow">
                <button type="button" data-type="text" title="Bloco de texto">
                  <span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4V3h10v1M8 3v10M6 13h4"/></svg></span>
                  <span class="lbl">Texto</span>
                </button>
                <button type="button" class="blockmenu" data-styletype="text" title="Editar estilo do Texto" aria-label="Editar estilo do Texto"></button>
              </div>
              <button type="button" data-type="image" title="Bloco de imagem">
                <span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.6" cy="6.4" r="1"/><path d="M3 12l3.4-3.2 2.4 2.2 2.2-2 2 1.8"/></svg></span>
                <span class="lbl">Imagem</span>
              </button>
              <button type="button" data-type="chart" title="Gráfico editável">
                <span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v12h12"/><rect x="4.2" y="8" width="2" height="4" fill="currentColor" stroke="none"/><rect x="7.2" y="5.5" width="2" height="6.5" fill="currentColor" stroke="none"/><rect x="10.2" y="3.5" width="2" height="8.5" fill="currentColor" stroke="none"/></svg></span>
                <span class="lbl">Gráfico</span>
              </button>
              <button type="button" data-type="sticker" title="Stickers — ícones e elementos prontos">
                <span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.5"/><path d="M8 5.2v5.6M6.4 6.8h2.6a1.2 1.2 0 0 1 0 2.4H6.4" stroke-linecap="round"/></svg></span>
                <span class="lbl">Stickers</span>
              </button>
            </div>
          </div>
        </div>

        <div class="sb-static">
          <div class="sb-static-title">Camadas</div>
          <div class="body">
            <div class="layers-list" id="layersList" role="list" aria-label="Ordem das camadas"></div>
          </div>
        </div>
      </div>
    </div><!-- /.pane-stack -->
    </div><!-- /.sidebar-panel -->
  </aside>

  <section class="stage">
    <div class="stage-toggles-host" aria-label="Overlays do story">
      <button type="button" id="btnUiPreview" title="Preview da UI do Instagram" aria-label="Preview da UI" aria-pressed="true">
        <!-- phone / phone-portrait -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      </button>
      <button type="button" id="btnShowSafe" title="Margens de segurança" aria-label="Margens de segurança" aria-pressed="true">
        <!-- scan / safe frame -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-dasharray="2 2"/></svg>
      </button>
    </div>
    <div class="stage-main">
      <button type="button" class="side-nav" id="btnPrev" title="Story anterior" aria-label="Anterior" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <div id="stage">
        <div id="pages-wrap">
          <div id="pages"></div>
        </div>
        <div class="page-counter" id="pageCounter" aria-live="polite">1 / 1</div>
      </div>
      <button type="button" class="side-nav" id="btnNext" title="Próximo story" aria-label="Próximo" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
      </button>
    </div>
    <div class="page-strip" id="pageStrip">
      <div class="strip-scroll" id="stripScroll" role="list"></div>
    </div>
  </section>
</main>

<!-- fmtbar / linkedit / alças: criados por ui-fmtbar.js e ui-handles.js -->
<input type="file" id="imgFile" accept="image/*" hidden>
<div id="imgPanel" class="float-panel" hidden></div>
<div id="textPanel" class="float-panel" hidden></div>
<div id="colAddMenu" hidden role="menu">
  <button type="button" data-type="text" role="menuitem">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4V3h10v1M8 3v10M6 13h4"/></svg>
    Texto
  </button>
  <button type="button" data-type="image" role="menuitem">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2 11l3-3 2.5 2.5L10 8l4 4"/></svg>
    Imagem
  </button>
  <button type="button" data-type="chart" role="menuitem">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v12h12"/><rect x="4.2" y="8" width="2" height="4" fill="currentColor" stroke="none"/><rect x="7.2" y="5.5" width="2" height="6.5" fill="currentColor" stroke="none"/><rect x="10.2" y="3.5" width="2" height="8.5" fill="currentColor" stroke="none"/></svg>
    Gráfico
  </button>
  <button type="button" data-type="sticker" role="menuitem">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.5"/><path d="M8 5.2v5.6M6.4 6.8h2.6a1.2 1.2 0 0 1 0 2.4H6.4" stroke-linecap="round"/></svg>
    Stickers
  </button>
</div>
<div id="stickerPanel" class="float-panel sticker-panel" hidden></div>

<!-- modal do gráfico (iframe graficos.html embed) — mesmo contrato do Diagramador -->
<div id="chartModal" hidden>
  <div class="cm-backdrop"></div>
  <div class="cm-panel">
    <div class="cm-bar"><span id="cmTitle">Extrair / montar gráfico</span><button type="button" id="cmClose" title="Fechar">✕</button></div>
    <iframe id="cmFrame" title="Extrair gráfico"></iframe>
  </div>
</div>

<div id="toast" role="status"></div>

<script type="module" src="stories.js"></script>
</body>
</html>
